[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ziren-fuzzer"
version = "0.0.1"
description="Fuzzer for the Ziren zkVM"
requires-python = ">= 3.10"
authors = []
readme = "README.md"
dependencies = [
  "circil",
  "zkvm-fuzzer-utils"
]

[project.scripts]
ziren-fuzzer = "ziren_fuzzer.cli:app"

[tool.setuptools.packages.find]
include = ["ziren_fuzzer*"]
exclude = []
