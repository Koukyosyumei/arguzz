
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-fuzzer"
version = "0.0.1"
description="Fuzzer for the Sphinx zkVM"
requires-python = ">= 3.10"
authors = []
readme = "README.md"
dependencies = [
  "circil",
  "zkvm-fuzzer-utils"
]

[project.scripts]
sphinx-fuzzer = "sphinx_fuzzer.cli:app"

[tool.setuptools.packages.find]
include = ["sphinx_fuzzer*"]
exclude = []
